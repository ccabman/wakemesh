name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run control API tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q app custom_components tests
      - name: Validate integration metadata
        run: |
          python -m json.tool custom_components/wakemesh/manifest.json >/dev/null
          python -m json.tool custom_components/wakemesh/strings.json >/dev/null
